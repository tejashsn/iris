[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "iris"
version = "0.1.0"
description = "Image Regression Inspection Suite — pixel-level drift measurement for ComfyUI benchmark outputs"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Tejash Kumar SN" }]
dependencies = [
    "numpy>=1.24",
    "Pillow>=10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
]
# Optional prompt-adherence backends. The core library stays numpy + pillow so it
# runs on a laptop with no GPU; nothing here is required for pixel metrics.
semantic = [
    "torch>=2.0",
    "transformers>=4.38",
]
# OWLv2 object detection also needs a recent transformers with vision support and
# scipy for post-processing; installed alongside the semantic extra.
detect = [
    "torch>=2.0",
    "transformers>=4.38",
    "scipy>=1.10",
]

[project.scripts]
iris-compare = "iris.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
